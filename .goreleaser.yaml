project_name: komari-agent

version: 2

builds:
  - id: main
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc,jsonv2
    flags:
      - -v
      - -trimpath
    ldflags:
      - -X github.com/komari-monitor/komari-agent/update.CurrentVersion={{.Version}}
      - -s
      - -w
      - -buildid=
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v3
      - v2
      - v1
    main: ./
    binary: agent
archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}-{{ .Amd64 }}"
    formats:
      - tar.gz
